<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#efe4d2" />
    <link rel="icon" href="data:," />
    <title>CAT DROP</title>
    <script type="module" crossorigin src="./assets/index-B8UFc5ry.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BXZtdK3m.css">
  </head>
  <body>
    <div id="app">
      <canvas id="game"></canvas>

      <div class="topbar">
        <div>
          <div class="eyebrow" id="eyebrow">CAT DROP</div>
          <div class="title" id="pageTitle">部屋を好き放題荒らせ</div>
        </div>
        <div class="status" id="status">loading…</div>
      </div>

      <div class="game-hud" id="gameHud">
        <div class="hud-cell">
          <small>被害額</small>
          <strong id="damageValue">¥0</strong>
        </div>
        <div class="hud-cell hud-center">
          <small>残り</small>
          <strong><span id="remainingValue">0</span><i>個</i></strong>
        </div>
        <div class="hud-cell hud-time">
          <small>TIME</small>
          <strong id="timeValue">45.0</strong>
        </div>
        <div class="combo-badge" id="comboBadge" aria-live="polite"></div>
      </div>

      <div class="motion-tray" id="motionTray" aria-label="猫モーション">
        <button class="motion-button" data-action="Jump"><span>ジャンプ</span><small>Space</small></button>
        <button class="motion-button" data-action="Sit"><span>座る</span><small>C</small></button>
        <button class="motion-button" data-action="DodgeL"><span>回避←</span><small>Q</small></button>
        <button class="motion-button" data-action="DodgeR"><span>回避→</span><small>E</small></button>
        <button class="motion-button" data-action="Roll"><span>転がる</span><small>R</small></button>
        <button class="motion-button" data-action="Stretch"><span>伸び</span><small>T</small></button>
        <button class="motion-button" data-action="SwipeL"><span>パンチ←</span><small>F</small></button>
        <button class="motion-button" data-action="SwipeR"><span>パンチ→</span><small>G</small></button>
        <button class="motion-button" data-action="Crouch"><span>伏せる</span><small>X</small></button>
        <button class="motion-button" data-action="Pounce"><span>飛びつく</span><small>P</small></button>
        <button class="motion-button" data-action="Groom"><span>毛づくろい</span><small>M</small></button>
        <button class="motion-button" data-action="Startled"><span>びっくり</span><small>Z</small></button>
        <button class="motion-button" data-action="LookAround"><span>見回す</span><small>L</small></button>
        <button class="motion-button" data-action="TurnL"><span>振り向く←</span><small>V</small></button>
        <button class="motion-button" data-action="TurnR"><span>振り向く→</span><small>B</small></button>
        <button class="motion-button" data-action="ScratchWall"><span>壁ひっかき</span><small>H</small></button>
      </div>

      <div class="game-actions" id="gameActions">
        <button class="game-action paw attack" data-action="Attack" aria-label="猫パンチ"><span>猫パンチ</span></button>
        <button class="game-action pounce" data-action="Pounce" aria-label="飛びつく">飛びつく</button>
        <button class="game-action secondary scratch" data-action="ScratchWall" aria-label="壁を爪でひっかく">爪とぎ</button>
      </div>

      <div class="hint" id="hint">左スティックで移動 · 右下で猫パンチ</div>
      <div class="joystick" id="joystick" aria-label="移動スティック">
        <div class="joystick-ring"></div>
        <div class="joystick-knob" id="joystickKnob"></div>
      </div>
      <div class="speed-panel" id="speedPanel">
        <div class="speed-label">MOVE</div>
        <div class="speed-value" id="speedValue">0.00</div>
        <div class="anim-value" id="animValue">IDLE</div>
      </div>

      <div class="impact-word" id="impactWord" aria-hidden="true"></div>

      <div class="overlay is-visible" id="startOverlay">
        <div class="overlay-card start-card">
          <div class="cat-mark">CAT DROP</div>
          <h1 id="startTitle">机の上を<br />空にしろ。</h1>
          <p id="startDescription">猫になって、目につくものを全部落とす。<br />連鎖で落とすほど気持ちいい。</p>
          <div class="stage-picker" id="stagePicker" aria-label="ステージ選択">
            <button class="stage-card is-selected" data-stage="0"><small>ROOM 01</small><strong>WORK DESK</strong><span>標準</span></button>
            <button class="stage-card" data-stage="1"><small>ROOM 02</small><strong>BREAKFAST</strong><span>連鎖</span></button>
            <button class="stage-card" data-stage="2"><small>ROOM 03</small><strong>GAMER DESK</strong><span>高額</span></button>
            <button class="stage-card" data-stage="3"><small>ROOM 04</small><strong>DRESSER</strong><span>密集</span></button>
          </div>
          <button class="primary-button" id="startButton">荒らし始める</button>
          <small id="startMeta">45秒 / 猫パンチ / 飛びつき / 壁で爪とぎ</small>
        </div>
      </div>

      <div class="overlay" id="resultOverlay">
        <div class="overlay-card result-card">
          <div class="result-kicker" id="resultKicker">RESULT</div>
          <h2 id="resultTitle">問題児</h2>
          <div class="result-damage" id="resultDamage">¥0</div>
          <div class="result-grid">
            <div><small>落下</small><strong id="resultDropped">0 / 0</strong></div>
            <div><small>最大コンボ</small><strong id="resultCombo">1 COMBO</strong></div>
            <div><small>残り時間</small><strong id="resultTime">0.0秒</strong></div>
          </div>
          <button class="primary-button" id="restartButton">もう一度荒らす</button>
          <button class="secondary-button" id="stageSelectButton">ステージを選ぶ</button>
        </div>
      </div>
    </div>
  </body>
</html>
