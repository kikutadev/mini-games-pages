<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#0b0805" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <meta name="description" content="Physics-based medal pusher prototype." />
    <title>MEDAL RUSH</title>
    <script type="module" crossorigin src="./assets/medal-rush-B9HNPV1W.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="stylesheet" crossorigin href="./assets/medal-rush-CWNeMjYH.css">
  </head>
  <body>
    <main id="medal-shell" aria-label="メダルプッシャー">
      <div id="medal-canvas-host"></div>

      <section id="slot-panel" class="slot-panel" aria-label="段差ゲートスロット">
        <div class="slot-topline">
          <span class="slot-title">STEP SLOT</span>
          <span id="slot-status" class="slot-status" data-spins="0">GATE</span>
        </div>
        <div class="slot-machine" aria-live="polite">
          <div class="slot-payline" aria-hidden="true"></div>
          <div class="slot-reel"><strong id="slot-reel-0">1</strong></div>
          <div class="slot-reel"><strong id="slot-reel-1">2</strong></div>
          <div class="slot-reel"><strong id="slot-reel-2">3</strong></div>
        </div>
        <div id="slot-result" class="slot-result">GATE → SPIN</div>
      </section>

      <div id="drop-guide" class="drop-guide" aria-hidden="true"></div>
      <div id="input-hint" class="input-hint">TAP / HOLD TO DROP</div>
      <div id="payout-pop" class="payout-pop" aria-live="polite"></div>

      <section class="medal-hud" aria-label="ゲーム情報">
        <div class="medal-stats">
          <div><span>PAYOUT</span><strong id="payout-value">0</strong></div>
          <div><span>ON TABLE</span><strong id="table-value">0</strong></div>
          <div><span>DROPPED</span><strong id="dropped-value">0</strong></div>
          <div class="time-cell"><span>TIME</span><strong id="time-value">00:00</strong></div>
          <button id="pause-button" type="button" aria-label="一時停止">Ⅱ</button>
        </div>
      </section>

      <section id="pause-panel" class="pause-panel" hidden>
        <div class="pause-card">
          <span>MEDAL FLOW SUSPENDED</span>
          <h1>PAUSED</h1>
          <button id="resume-button" type="button">RESUME</button>
        </div>
      </section>
    </main>
  </body>
</html>
