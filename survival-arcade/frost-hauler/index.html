<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no"
    />
    <meta name="theme-color" content="#dcecf0" />
    <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
    <meta name="description" content="木材を運んで凍ったキャンプを育てる短尺3Dゲーム。" />
    <title>FROST HAULER</title>
    <script type="module" crossorigin src="../assets/frostHauler-vv78WvG3.js"></script>
    <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
    <link rel="modulepreload" crossorigin href="../assets/runtime-DlwBDPwP.js">
    <link rel="modulepreload" crossorigin href="../assets/movement-input-7FZgQj6R.js">
    <link rel="stylesheet" crossorigin href="../assets/runtime-BQTM19Jm.css">
    <link rel="stylesheet" crossorigin href="../assets/movement-input-FTTvBEOz.css">
    <link rel="stylesheet" crossorigin href="../assets/frostHauler-DExG6VkF.css">
  </head>
  <body>
    <main id="game">
      <div id="canvas-host" aria-label="FROST HAULER game canvas"></div>

      <header class="hud">
        <a class="back" href="../" aria-label="ゲーム一覧へ戻る">←</a>
        <div id="wood-resource" class="resource" data-progressive-stat hidden>
          <span>木材</span>
          <strong id="wood-bank">0</strong>
        </div>
        <div class="resource">
          <span>所持</span>
          <strong><b id="carry-count">0</b>/20</strong>
        </div>
        <div class="resource resource--heat">
          <span>暖房</span>
          <strong><b id="heat-value">24</b>%</strong>
          <i class="heat-track"><i id="heat-fill"></i></i>
        </div>
        <div id="food-resource" class="resource resource--food is-locked">
          <span>食料</span>
          <strong id="food-bank">0</strong>
        </div>
      </header>

      <div class="objective">
        <span id="objective-kicker">01 · 木材集め</span>
        <strong id="objective-text">木まで移動 · 近づくと自動で伐採</strong>
      </div>

      <div id="event-message" class="event-message" aria-live="polite"></div>

      <div id="joystick" class="joystick" aria-hidden="true">
        <span id="joystick-knob"></span>
      </div>

      <footer class="hint">
        <span>ドラッグで移動</span>
        <span>WASD / 矢印キー</span>
      </footer>
    </main>
  </body>
</html>
