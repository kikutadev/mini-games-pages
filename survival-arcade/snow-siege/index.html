<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#dcebf0" />
  <link rel="icon" href="../favicon.svg" type="image/svg+xml" />
  <meta name="description" content="物資を運んで砦を築き、雪だるまの襲撃を防ぐ短尺3Dゲーム。" />
  <title>SNOW SIEGE</title>
  <script type="module" crossorigin src="../assets/snowSiege-DxH8mQW4.js"></script>
  <link rel="modulepreload" crossorigin href="../assets/modulepreload-polyfill-P2Xu9kJm.js">
  <link rel="modulepreload" crossorigin href="../assets/runtime-DlwBDPwP.js">
  <link rel="modulepreload" crossorigin href="../assets/movement-input-7FZgQj6R.js">
  <link rel="stylesheet" crossorigin href="../assets/runtime-BQTM19Jm.css">

  <link rel="stylesheet" crossorigin href="../assets/snowSiege-R6gi7LaP.css">
</head>
<body>
  <main id="snow-siege-game">
    <div id="siege-canvas" aria-label="SNOW SIEGE game canvas"></div>
    <header class="siege-hud">
      <a class="siege-back" href="../" aria-label="ゲーム一覧へ戻る">←</a>
      <div class="siege-stat"><span>木材</span><strong id="siege-carry">0 / 6</strong></div>
      <div id="siege-cores-stat" class="siege-stat" data-progressive-stat hidden><span>コア</span><strong id="siege-cores">0 / 6</strong></div>
      <div id="siege-defended-stat" class="siege-stat" data-progressive-stat hidden><span>防衛</span><strong id="siege-defended">0 / 18</strong></div>
    </header>
    <div class="siege-objective">
      <span id="siege-objective-kicker">01 · 木材集め</span>
      <strong id="siege-objective-text">立っている木へ移動 · 近づくと自動で伐採</strong>
    </div>
    <div id="siege-event" class="siege-event" aria-live="polite"></div>
    <div id="siege-joystick" class="siege-joystick" aria-hidden="true"><span id="siege-joystick-knob"></span></div>
    <footer class="siege-hint"><span>ドラッグで移動</span><span>WASD / 矢印キー</span></footer>
  </main>
</body>
</html>
