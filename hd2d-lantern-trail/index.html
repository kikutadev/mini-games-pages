<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"><meta name="theme-color" content="#101b27"><title>灯火の庭 | HD-2D風ゲーム</title><link rel="stylesheet" href="./style.css"></head>
<body><main id="app"><div id="viewport">
<canvas id="game" aria-label="ゲーム画面"></canvas><canvas id="glow" aria-hidden="true"></canvas><div class="vignette"></div>
<header class="hud"><div class="identity"><small>PIXEL DIORAMA / PROTOTYPE</small><strong>灯火の庭</strong></div><div class="hud-right"><div id="hearts">♥ ♥ ♥ ♥ ♥</div><div id="progress">灯火 <b>0 / 3</b></div></div></header>
<div id="toast" role="status"><span id="toastTitle">消えた灯火を探す</span><small id="toastSub">光を集め、森の奥の門へ</small></div>
<div class="top-actions"><button id="sound" aria-label="効果音切替">♪</button><button id="help" aria-label="遊び方">?</button></div>
<div id="hint">WASD / 方向キー：移動　　Space / クリック：攻撃</div>
<div id="joystick"><div id="stick"></div></div><button id="attack" aria-label="攻撃"><span>⚔</span><small>ATTACK</small></button>
<div id="overlay" hidden><div class="ending"><small id="endingEyebrow">THE LIGHT RETURNS</small><h1 id="endingTitle">森に、光が戻った。</h1><p id="endingDescription">三つの灯火が、古い門を目覚めさせた。</p><button id="restart">もう一度歩く ↗</button></div></div>
<div id="helpPanel" hidden><div class="help-content"><h2>遊び方</h2><p>森の三つの灯火に触れて光を戻し、右奥の古い門に向かいましょう。影の敵は剣で撃退できます。</p><p>PC：WASD／方向キーで移動、Space／クリックで攻撃。スマホ：左のスティックで移動、右の剣で攻撃。</p><button id="closeHelp">閉じる</button></div></div>
</div><footer><span>ドット絵 × 立体ジオラマ × 光の探索試作</span><span>LOCAL PLAYABLE DEMO</span></footer></main><script defer src="./game.js"></script></body></html>
