<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#073b57">
  <title>ぷくぷくリーフ</title>
  <style>
    html, body, #canvas { margin:0; padding:0; border:0; width:100%; height:100%; }
    html, body { background:#031d2b; overflow:hidden; touch-action:none; }
    body { display:flex; align-items:center; justify-content:center; }
    #canvas { display:block; image-rendering:auto; }
    #canvas:focus { outline:none; }
    #status { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; background:#073b57; visibility:hidden; }
    #status-brand { display:flex; flex-direction:column; align-items:center; gap:10px; color:#e8fbf8; font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif; letter-spacing:.04em; }
    #status-brand strong { color:#e8fbf8; font-size:clamp(22px,4vw,34px); font-weight:650; }
    #status-brand small { color:#acd9da; font-size:clamp(12px,2vw,16px); }
    .status-bubble { width:42px; height:42px; border-radius:50%; border:2px solid rgba(202,250,247,.8); background:rgba(118,217,218,.16); box-shadow:0 0 0 8px rgba(118,217,218,.06); animation:floatBubble 1.4s ease-in-out infinite; }
    @keyframes floatBubble { 50% { transform:translateY(-7px) scale(1.05); box-shadow:0 0 0 13px rgba(118,217,218,.03); } }
    #status-notice { display:none; max-width:560px; margin:24px; padding:16px; border-radius:12px; background:#173d49; color:#eefcff; font:16px/1.5 system-ui,sans-serif; }
  </style>
</head>
<body>
  <canvas id="canvas">Canvas is required.</canvas>
  <noscript>JavaScript is required.</noscript>
  <div id="status">
    <div id="status-brand"><span class="status-bubble"></span><strong>ぷくぷくリーフ</strong><small>海のなかまを呼んでいます</small></div>
    <div id="status-notice"></div>
  </div>
  <script src="index.js"></script>
  <script>
    const GODOT_CONFIG = {
      args: [], canvasResizePolicy: 2, emscriptenPoolSize: 8,
      ensureCrossOriginIsolationHeaders: true, executable: "index",
      experimentalVK: false, mainPack: "game-40cd713a18ab.pck",
      fileSizes: {"game-40cd713a18ab.pck": 7640348, "index.wasm": 37700666},
      focusCanvas: true, gdextensionLibs: [], godotPoolSize: 4
    };
    const GODOT_THREADS_ENABLED = false;
    const engine = new Engine(GODOT_CONFIG);
    (function () {
      const overlay = document.getElementById('status');
      const notice = document.getElementById('status-notice');
      let initializing = true;
      function mode(value) {
        if (!initializing) return;
        if (value === 'hidden') { overlay.remove(); initializing = false; return; }
        overlay.style.visibility = 'visible';
        notice.style.display = value === 'notice' ? 'block' : 'none';
      }
      function fail(err) {
        console.error(err);
        notice.textContent = err instanceof Error ? err.message : String(err);
        mode('notice');
        initializing = false;
      }
      const missing = Engine.getMissingFeatures({threads: GODOT_THREADS_ENABLED});
      if (missing.length) { fail('このブラウザでは必要な機能が利用できません: ' + missing.join(', ')); return; }
      overlay.style.visibility = 'visible';
      engine.startGame().then(() => mode('hidden'), fail);
    })();
  </script>
</body>
</html>
