<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101c31">
  <meta name="description" content="敵の強さを、そのまま奪え。敵を引っ張って味方として増やす戦場コピーアクション COPY WAR。">
  <title>COPY WAR — 敵をコピーして、味方にしろ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="screen">
    <header class="hud">
      <div class="brand"><span class="star">✦</span> COPY<span>WAR</span></div>
      <div class="time-unit"><span>残り</span><b id="time">220</b><small>秒</small></div>
    </header>
    <section class="body">
      <div class="enemy-header">
        <div class="faction"><span class="red-icon">◆</span> <span id="red-label">防衛線 1/12・外郭防衛線</span> <small id="red-count">6体</small></div>
        <div class="hp-wrap"><div class="hp-bar enemy"><div id="enemy-health"></div></div></div>
      </div>
      <div class="stage-line"><span id="stage-progress"></span></div>
      <div class="arena-wrap" id="arena-wrap">
        <canvas id="game" width="360" height="600" aria-label="敵を掴んで引っ張り、味方としてコピーする戦場"></canvas>
        <div class="battle-toast" id="toast"></div>
      </div>
      <div class="friend-header">
        <div class="faction"><span class="blue-icon">◆</span> 味方部隊 <small id="blue-count">4体</small></div>
        <div class="hp-wrap"><div class="hp-bar ally"><div id="ally-health"></div></div></div>
      </div>
      <div class="control">
        <div class="control-symbol">↧</div>
        <div class="control-text"><strong id="instruction">赤い敵をつかんで、味方側へ引っ張る</strong><span id="sub-instruction">敵の能力を丸ごとコピー。何度でも味方にできる。</span></div>
        <button type="button" id="cancel" aria-label="コピー選択を解除" hidden>解除</button>
      </div>
    </section>
    <div id="overlay" class="overlay">
      <div class="intro-card">
        <section id="landing">
          <div class="eyebrow">COPY WAR · 4つの戦線</div>
          <div class="intro-graphic" aria-hidden="true">
            <canvas id="intro-squad" width="300" height="92"></canvas>
          </div>
          <h1 id="overlay-title">敵をコピーして、<br><em>味方にしろ。</em></h1>
          <p id="overlay-description">全12ステージ。敵を奪い、進軍し、軍勢を強化しよう。</p>
          <div class="chapter-selector" id="chapters" aria-label="出撃する章">
            <button type="button" data-chapter="0">第1章　辺境戦線</button>
            <button type="button" data-chapter="1">第2章　天空回廊</button>
            <button type="button" data-chapter="2">第3章　機械工廠</button>
            <button type="button" data-chapter="3">第4章　深淵中枢</button>
          </div>
          <div class="meta-row">
            <span class="wallet">◆ <strong id="crystals">0</strong> 結晶</span>
            <button type="button" id="show-upgrades">永続強化 <span>→</span></button>
          </div>
          <button type="button" id="start">出撃する <span>→</span></button>
          <p class="intro-footnote" id="chapter-subtitle">各章3ステージ。クリアで次の章を解放。</p>
        </section>
        <section id="workshop" hidden>
          <div class="workshop-head"><div class="eyebrow">COPY LAB</div><button type="button" id="back">← 戻る</button></div>
          <h2>コピー研究所</h2>
          <p class="workshop-lead">敵をコピーして得た結晶で、次の戦いをもっと強く。</p>
          <div class="meta-row"><span class="wallet">◆ <strong id="crystals-workshop">0</strong> 結晶</span><span class="persist-mark">端末に自動保存</span></div>
          <div class="boss-dna" id="boss-dna">獲得したボス因子 0/4</div>
          <div class="upgrade-list" id="upgrade-list"></div>
          <button type="button" class="workshop-done" id="workshop-done">戦場へ戻る →</button>
        </section>
      </div>
    </div>
  </main>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
