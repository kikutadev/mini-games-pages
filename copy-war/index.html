<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0a1728">
  <meta name="description" content="敵の攻撃も、爆発も、戦場ごとコピー。COPY WAR — コピー＆ペーストで戦況を書き換えるリアルタイムアクション。">
  <title>COPY WAR — 戦況を、コピペで変えろ。</title>
  <link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./overlay.css">
</head>
<body>
  <main id="screen" class="game-screen">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">✦</span><span>COPY<span class="accent">WAR</span></span></div>
      <div class="header-stats">
        <div class="stat"><span class="stat-label">SCORE</span><strong id="score">0</strong></div>
        <div class="stat timer"><span class="stat-label">TIME</span><strong id="time">82</strong></div>
      </div>
    </header>
    <section class="game-layout">
      <div class="objective">
        <span class="objective-title"><span class="live-dot"></span>CORE DEFENSE</span>
        <div class="health-group">
          <div class="health-track"><span id="health-fill"></span></div>
          <span class="health-numeral" id="health-text">100%</span>
        </div>
      </div>
      <div id="arena-shell" class="arena-shell">
        <canvas id="arena" width="360" height="600" aria-label="コピー＆ペーストで敵の攻撃を利用してコアを守る戦場"></canvas>
        <div id="toast" class="toast" aria-live="polite"></div>
        <div class="crosshair corner-a"></div><div class="crosshair corner-b"></div>
      </div>
      <div class="control-strip">
        <div class="left-control">
          <div class="tool-label" id="selection">COPY</div>
          <div class="tool-instruction" id="action">敵の弾をタップ</div>
          <div class="tool-help" id="help">ドラッグして複数まとめてコピー</div>
        </div>
        <button type="button" id="cancel" class="cancel" aria-label="コピー選択を解除する"><span>×</span><small>解除</small></button>
      </div>
    </section>
    <footer class="footer"><span>コピー → ペースト → 連鎖</span><span>撃破でコア修復</span></footer>
    <div id="overlay" class="overlay intro">
      <div class="overlay-backdrop"></div>
      <div class="overlay-card">
        <div class="eyebrow"><span class="eyebrow-dot"></span> 敵の攻撃を、そのまま奪え</div>
        <div class="graphic">
          <span class="source-orb">●</span><span class="route-icon">↗</span><span class="target-orbs">●<br>● ●</span>
          <div class="graphic-ring ring-one"></div><div class="graphic-ring ring-two"></div>
        </div>
        <p class="mini-label">敵の弾も、爆発も、コピーできる。</p>
        <h1 id="overlay-title">COPY<span>WAR</span></h1>
        <p id="overlay-text" class="overlay-text">敵の弾をコピーして、敵の近くに貼り付けろ。<br>爆弾も、弾幕も、敵自身も増やせる。</p>
        <div class="instructions">
          <div><b>01</b><span>敵の弾を<strong>タップ</strong></span></div>
          <div><b>02</b><span>敵の手前を<strong>タップ</strong>して貼る</span></div>
          <div><b>03</b><span>ドラッグでまとめてコピー</span></div>
        </div>
        <button id="overlay-button" class="start-button" type="button">ゲームを始める <span>→</span></button>
        <p class="note">敵を倒すとコアが少し修復する。</p>
      </div>
    </div>
  </main>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
