<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,minimum-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#101c31">
  <meta name="description" content="敵の強さを、そのまま奪え。敵を引っ張って味方として増やす戦場コピーアクション COPY WAR。">
  <title>COPY WAR — 敵をコピーして、味方にしろ</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main id="screen">
    <header class="hud">
      <div class="brand"><span class="star">✦</span> COPY<span>WAR</span></div>
      <div class="time-unit"><span>残り</span><b id="time">100</b><small>秒</small></div>
    </header>
    <section class="body">
      <div class="enemy-header">
        <div class="faction"><span class="red-icon">◆</span> 敵の拠点 <small id="red-count">6体</small></div>
        <div class="hp-wrap"><div class="hp-bar enemy"><div id="enemy-health"></div></div></div>
      </div>
      <div class="arena-wrap" id="arena-wrap">
        <canvas id="game" width="360" height="600" aria-label="敵を掴んで引っ張り、味方としてコピーする戦場"></canvas>
        <div class="battle-toast" id="toast"></div>
      </div>
      <div class="friend-header">
        <div class="faction"><span class="blue-icon">◆</span> 味方の拠点 <small id="blue-count">4体</small></div>
        <div class="hp-wrap"><div class="hp-bar ally"><div id="ally-health"></div></div></div>
      </div>
      <div class="control">
        <div class="control-symbol">↧</div>
        <div class="control-text"><strong id="instruction">赤い敵をつかんで、味方側へ引っ張る</strong><span id="sub-instruction">敵の能力を丸ごとコピー。何度でも味方にできる。</span></div>
        <button type="button" id="cancel" aria-label="コピー選択を解除" hidden>解除</button>
      </div>
    </section>
    <div id="overlay" class="overlay">
      <div class="intro-card">
        <div class="eyebrow">ENEMY → ALLY</div>
        <div class="intro-graphic">
          <div class="intro-enemy">敵</div>
          <div class="intro-arrow">⤵</div>
          <div class="intro-ally">味方</div>
        </div>
        <h1 id="overlay-title">敵をコピーして、<br><em>味方にしろ。</em></h1>
        <p id="overlay-description">強敵ほど、奪えば強い。<br>指で敵を引っ張り、好きな場所に味方を増やそう。</p>
        <button type="button" id="start">バトル開始 <span>→</span></button>
        <p class="intro-footnote">味方を増やし、上の敵拠点を破壊せよ。</p>
      </div>
    </div>
  </main>
  <script type="module" src="./src/app.mjs"></script>
</body>
</html>
