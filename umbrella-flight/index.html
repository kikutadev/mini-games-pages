<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#82c8ef" />
    <link rel="icon" href="data:," />
    <title>UMBRELLA FLIGHT</title>
    <script type="module" crossorigin src="./assets/index-Bdn9r1u1.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-B3Vl9UBb.css">
  </head>
  <body>
    <div id="app">
      <div id="scene" aria-hidden="true"></div>
      <div id="rain-overlay" class="rain-overlay" aria-hidden="true"></div>
      <div id="lightning-flash" class="lightning-flash" aria-hidden="true"></div>

      <section id="start-screen" class="start-screen ui-layer">
        <div class="title-lockup">
          <p id="stage-kicker" class="kicker">STAGE 1 / 5</p>
          <h1>UMBRELLA<br /><span>FLIGHT</span></h1>
          <p id="stage-name" class="stage-name">そよ風草原</p>
          <p id="stage-tagline" class="tagline">風に乗って、着地点まで。</p>
        </div>
        <div class="start-actions">
          <div id="stage-selector" class="stage-selector" aria-label="ステージ選択"></div>
          <button id="start-button" class="primary-button" type="button">飛ばされる</button>
          <p class="start-note">押したまま上下左右へドラッグ ・ 離すと傘を閉じて急降下</p>
        </div>
      </section>

      <header id="play-hud" class="play-hud ui-layer hidden" aria-live="polite">
        <div class="hud-primary">
          <small id="hud-stage">STAGE 1</small>
          <span>GOAL</span>
          <strong id="distance-value">260m</strong>
        </div>
        <div class="hud-secondary">
          <div id="altitude-card"><span id="altitude-label">高度</span><strong id="altitude-value">20m</strong></div>
          <div><span>風</span><strong id="wind-value">8.4</strong><small>m/s</small></div>
        </div>
      </header>

      <div id="first-touch-hint" class="first-touch-hint ui-layer hidden">
        <strong>押したまま上下左右へ</strong>
        <span>傘を傾けて、ビルの間を抜ける</span>
      </div>

      <div id="flight-control" class="flight-control ui-layer hidden" aria-hidden="true">
        <span class="control-axis axis-x"></span>
        <span class="control-axis axis-y"></span>
        <span id="control-knob" class="control-knob"></span>
      </div>

      <div id="gust-banner" class="gust-banner ui-layer" aria-hidden="true">
        <span>GUST!</span>
      </div>

      <div id="near-miss-banner" class="near-miss-banner ui-layer" aria-hidden="true">
        <span>CLOSE!</span>
      </div>

      <div id="speed-vignette" class="speed-vignette ui-layer" aria-hidden="true"></div>

      <div id="goal-callout" class="goal-callout ui-layer hidden">
        <span>ROOFTOP</span>
        <strong>▼</strong>
      </div>

      <section id="result-screen" class="result-screen ui-layer hidden" aria-live="assertive">
        <p id="result-kicker" class="result-kicker">ROOFTOP ARRIVAL</p>
        <h2 id="result-title">LANDED!</h2>
        <div class="result-grade" id="result-grade">SAFE LANDING</div>
        <dl class="result-stats">
          <div><dt>FLIGHT</dt><dd id="result-time">28.4s</dd></div>
          <div><dt>MAX ALT.</dt><dd id="result-altitude">34m</dd></div>
          <div><dt>GUSTS</dt><dd id="result-gusts">3</dd></div>
        </dl>
        <div class="result-actions">
          <button id="next-button" class="primary-button next-button" type="button">次のステージ</button>
          <button id="retry-button" class="secondary-button" type="button">もう一度</button>
        </div>
      </section>
    </div>
  </body>
</html>
